<div class="controls">
  <label for="station">Compare station</label>
  <select id="station"></select>
</div>
<div id="maps" class="maps"></div>
<div class="legend map-keys" aria-label="Net flow legend">
  <span><b class="inflow map-symbol" aria-hidden="true">●</b> Net inflow (+)</span>
  <span><b class="outflow map-symbol" aria-hidden="true">▼</b> Net outflow (−)</span>
  <span><b class="map-symbol" aria-hidden="true">·</b> Zero net flow</span>
  <span id="magnitude">Symbol area · trips/day</span>
</div>
<div id="station-details" class="details" aria-live="polite"></div>
